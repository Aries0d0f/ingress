name: Build & Deploy to Cloudflare Worker

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # rustup ships with the runner; installs what rust-toolchain.toml pins.
      - run: rustup toolchain install

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/worker-build
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-v2-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run test

      - if: github.event_name == 'push'
        run: |
          subject="$(printf '%s' "$COMMIT_MESSAGE" | head -n 1 | cut -c 1-100)"
          bun run deploy --message "$subject" --tag "${GITHUB_SHA::7}"
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
