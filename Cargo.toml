[package]
name = "ingress"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
woothee = "0.13.0"
worker = "0.8.7"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
lto = true
strip = true
codegen-units = 1
opt-level = "s"
